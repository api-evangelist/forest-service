note: >-
  The Forest Service ships no MCP server. Nothing was found on the agency's websites, in the
  USDAForestService GitHub organization (16 repositories, none MCP-related), or on any
  /.well-known/ path — and no endpoint was guessed at, because a guessed MCP URL that happens to
  answer is worse than none. What follows is a CANDIDATE tool surface derived from endpoints this
  pipeline actually called and got a 200 from; it describes what a server would expose if someone
  built one, and it asserts nothing about the agency. Every tool below maps to a documented,
  anonymous, read-only GET, which is about as clean a candidate surface as an agency ever offers.
