source: >-
  Response headers observed on live unauthenticated calls to every Forest Service API surface,
  plus a documentation search across the FIADB-API docs, the Research Data Archive API PDF and
  the FSGeodata Clearinghouse help pages, 2026-09-10.
limit_count: 0
note: >-
  An honest zero. The Forest Service documents no rate limit for any of its four public APIs, and
  no surface returns a rate-limit header of any kind — no X-RateLimit-*, no RateLimit-*, no
  Retry-After — on a successful or a failed response. That is not the same as unlimited: a caller
  has no published budget and no runtime signal, so the only safe assumption for an automated
  client is that throttling, if it exists, will arrive without warning at the edge (Azure Front
  Door in front of www.fs.usda.gov, an F5 load balancer in front of the archive service) rather
  than from the application. Politeness has to be self-imposed.
