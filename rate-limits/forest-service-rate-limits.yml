practical_ceiling:
  detail: >-
    The one soft ceiling actually documented is a page-size default, not a rate: Research Data
    Archive /search returns 10 rows unless `rows` is raised. Query cost is visible in the
    response — every archive response echoes QTime (0.007-0.077 s across the calls we made) and
    the FIADB-API returned a 34 KB estimate set in a single request.
