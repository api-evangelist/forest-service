aid: forest-service
name: Forest Service
description: >-
  The U.S. Forest Service is an agency of the U.S. Department of Agriculture managing 193 million
  acres of national forests and grasslands. Not a software vendor, it nonetheless runs four free,
  entirely unauthenticated public HTTP APIs: the FIADB-API behind EVALIDator, returning Forest
  Inventory and Analysis population estimates with sampling errors from the nation's continuous
  forest census; the Research Data Archive web service, a search-and-retrieve API over
  DOI-registered research datasets that also runs an OAI-PMH 2.0 repository serving Dublin Core
  and FGDC metadata; and two FSGeodata ArcGIS REST servers publishing the Enterprise and Research
  Data Warehouse map services, 144 in the EDW folder alone, each also exposing a SOAP contract.
  A DCAT-US 1.1 open-data catalog is published through Geospatial Data Discovery. No API needs a
  key or an account, every operation is a read, and the data are works of the U.S. government.
