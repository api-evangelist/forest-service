apis:
  - aid: forest-service:fiadb-api
    name: FIADB-API (EVALIDator)
    description: >-
      The Forest Inventory and Analysis Database API, the machine surface behind the EVALIDator
      web application. A single GET or POST to /fullreport returns population estimates with
      standard errors, variances and plot counts, grouped by row, column and optional page
      attributes, for one or more state/year evaluations. Every classed parameter has a live
      value dictionary at /fullreport/parameters/<name>. Free, anonymous, CORS-open, and
      documented with worked Python and R examples.
    humanURL: https://apps.fs.usda.gov/fiadb-api/
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/forest-service.png
    baseURL: https://apps.fs.usda.gov/fiadb-api
    tags:
      - Forest Inventory
      - Research Data
      - Statistics
    properties:
      - type: Documentation
        url: https://apps.fs.usda.gov/fiadb-api/
      - type: APIReference
        url: https://apps.fs.usda.gov/fiadb-api/
      - type: Console
        url: https://apps.fs.usda.gov/fiadb-api/evalidator?newForm=True
      - type: Support
        url: mailto:SM.FS.FIA.Digital@usda.gov
      - type: AgentSkill
        url: skills/forest-service-forest-inventory-estimate.md
  - aid: forest-service:research-data-archive
    name: Forest Service Research Data Archive Web Service
    description: >-
      Search and retrieve DOI-registered Forest Service research data publications. Four REST
      endpoints — /search, /product, /organizations and /efrs — plus a full OAI-PMH 2.0 repository
      at /oaipmh serving Dublin Core (oai_dc) and FGDC-STD-001.1-1999 (fgdc) metadata. The two
      lookup endpoints exist so a client can discover the legal values for the funder and
      experimental-forest filters. XML by default, JSON on request. Dated release notes run from
      2014 to 2019 and the service is still answering.
    humanURL: https://www.fs.usda.gov/rds/archive/webservice/
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/forest-service.png
    baseURL: https://www.fs.usda.gov/rds/archive/webservice
    tags:
      - Research Data
      - Metadata
      - OAI-PMH
    properties:
      - type: Documentation
        url: https://www.fs.usda.gov/rds/archive/webservice/assets/ResearchDataArchiveAPIDocumentation.pdf
      - type: APIReference
        url: https://www.fs.usda.gov/rds/archive/webservice/
      - type: GettingStarted
        url: https://www.fs.usda.gov/rds/archive/webservice/assets/test_scripts.zip
      - type: ChangeLog
        url: changelog/forest-service-changelog.yml
      - type: Website
        url: https://www.fs.usda.gov/rds/archive/
      - type: AgentSkill
        url: skills/forest-service-find-research-data.md
  - aid: forest-service:fsgeodata-edw-map-services
    name: FSGeodata Enterprise Data Warehouse Map Services
    description: >-
      The Forest Service enterprise ArcGIS REST server. A self-describing services directory
      (currentVersion 11.5) across nine folders — EDW, RDW_AdminAndOwnership, RDW_Climate,
      RDW_FIA_ForestAtlas, RDW_InventoryAndProducts, RDW_LandscapeAndWildlife, RDW_Wildfire,
      Utilities and wo_nrm_iweb — with 144 MapServer services in the EDW folder alone covering
      surface ownership, forest system boundaries, activity records, aerial fire retardant
      avoidance areas, aquatic organism passage and Bailey's ecoregions. Each service document
      links the dataset's FGDC metadata XML, and each service also publishes a WSDL 1.1 SOAP
      contract with 55 operations. OGC WMS/WFS is not enabled.
    humanURL: https://data.fs.usda.gov/geodata/edw/mapServices.php
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/forest-service.png
    baseURL: https://apps.fs.usda.gov/arcx/rest/services
    tags:
      - Geospatial
      - Public Lands
      - Wildfire
    properties:
      - type: Documentation
        url: https://data.fs.usda.gov/geodata/edw/mapServices.php
      - type: APIReference
        url: https://apps.fs.usda.gov/arcx/rest/services?f=json
      - type: WSDL
        url: wsdl/forest-service-arcgis-mapserver.wsdl
      - type: Website
        url: https://data.fs.usda.gov/geodata/
      - type: Support
        url: https://data.fs.usda.gov/geodata/contactus.php
  - aid: forest-service:fsgeodata-rdw-map-services
    name: FSGeodata Research Data Warehouse Map Services
    description: >-
      A second Forest Service ArcGIS REST server carrying the research data warehouse folders —
      RDW_AdminAndOwnership, RDW_Climate, RDW_FHP_TreeSpeciesMetrics, RDW_ForestEcology,
      RDW_Landfire, RDW_LandscapeAndWildlife and RDW_Wildfire — plus hosted feature services.
      Same anonymous ArcGIS REST contract and same ?wsdl SOAP surface as the enterprise server.
    humanURL: https://data.fs.usda.gov/geodata/
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/forest-service.png
    baseURL: https://apps.fs.usda.gov/fsgisx01/rest/services
    tags:
      - Geospatial
      - Research Data
      - Wildfire
    properties:
      - type: APIReference
        url: https://apps.fs.usda.gov/fsgisx01/rest/services?f=json
      - type: Documentation
        url: https://data.fs.usda.gov/geodata/edw/mapServices.php
  - aid: forest-service:geospatial-data-discovery
    name: U.S. Forest Service Geospatial Data Discovery (DCAT-US catalog)
    description: >-
      The agency's Geospatial Data Discovery site publishes a machine-readable DCAT-US 1.1 /
      Project Open Data catalog of Forest Service datasets — a ~2 MB JSON document declaring
      "@type": "dcat:Catalog" and conformsTo the Project Open Data v1.1 schema, with a dataset[]
      array of dcat:Dataset entries. This is the inventory federal agencies publish under the OPEN
      Government Data Act. The site is named as an official access route on the agency's own
      FSGeodata Clearinghouse Map Services page, which is how the Esri-tenant hostname is
      confirmed as a Forest Service surface rather than a vendor's.
    humanURL: https://data-usfs.hub.arcgis.com/
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/forest-service.png
    baseURL: https://data-usfs.hub.arcgis.com
    tags:
      - Open Data
      - Geospatial
      - Metadata
    properties:
      - type: APIReference
        url: https://data-usfs.hub.arcgis.com/api/feed/dcat-us/1.1.json
      - type: Documentation
        url: https://data.fs.usda.gov/geodata/edw/mapServices.php
