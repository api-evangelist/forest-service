source: >-
  CRAN metadata (crandb.r-pkg.org), PyPI JSON API, npm registry, and the USDAForestService GitHub
  organization. Version and published dates read from each registry's metadata endpoint on
  2026-09-10.
note: >-
  The Forest Service ships no client SDK for any of its four HTTP APIs — the FIADB-API, the
  Research Data Archive web service, and the two ArcGIS REST servers are all called with a plain
  HTTP client, and the FIADB-API docs illustrate exactly that with hand-rolled `requests` (Python)
  and `httr` (R) examples rather than a library. What the agency does publish on a registry is its
  scientific tooling: two CRAN packages that read Forest Inventory and Analysis data, maintained
  out of the agency's own GitHub organization. They are first-party agency software but they are
  not clients for the web APIs profiled here, and they are recorded as such.
